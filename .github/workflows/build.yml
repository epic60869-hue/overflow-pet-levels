name: Build

on:
  push:
    branches:
      - nopomod-26.2-replace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace with NopoMod source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/NopoTheGamer/NopoMod.git /tmp/NopoMod

          # Delete the old project files while keeping the destination .git directory.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy the entire NopoMod source tree without copying its Git metadata.
          rsync -a --exclude='.git' /tmp/NopoMod/ ./

          # Port the upstream project to Minecraft 26.2 / Java 25.
          sed -i \
            -e 's/^minecraft_version=.*/minecraft_version=26.2/' \
            -e 's/^loader_version=.*/loader_version=0.19.3/' \
            -e 's/^loom_version=.*/loom_version=1.17-SNAPSHOT/' \
            -e 's/^fabric_kotlin_version=.*/fabric_kotlin_version=1.13.13+kotlin.2.4.10/' \
            -e 's/^fabric_api_version=.*/fabric_api_version=0.159.0+26.2/' \
            gradle.properties

          sed -i \
            -e 's/version "2\.3\.21"/version "2.4.10"/' \
            -e 's/options\.release = 21/options.release = 25/' \
            -e 's/JvmTarget\.JVM_21/JvmTarget.JVM_25/' \
            -e 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_25/g' \
            build.gradle.kts

          sed -i 's/minecraft": "~26\.1"/minecraft": "~26.2"/' src/main/resources/fabric.mod.json
          sed -i 's/"java": ">=21"/"java": ">=25"/' src/main/resources/fabric.mod.json

          # Update copied CI workflows to Java 25 where applicable.
          if [ -d .github/workflows ]; then
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | while IFS= read -r -d '' f; do
              sed -i -e "s/java-version: ['\"]21['\"]/java-version: '25'/g" "$f"
            done
          fi

          # Remove temporary migration workflows from the final source tree.
          rm -f .github/workflows/migrate-nopo.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace project with NopoMod port for Minecraft 26.2"
          git push origin HEAD:nopomod-26.2-replace

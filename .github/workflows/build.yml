name: Build

on:
  push:
    branches:
      - nopomod-26.2-replace
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download NopoMod
        shell: bash
        run: git clone --depth 1 https://github.com/NopoTheGamer/NopoMod.git /tmp/NopoMod

      - name: Copy NopoMod source
        shell: bash
        run: |
          set -euxo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/NopoMod/ ./
          test -f build.gradle.kts
          test -f src/main/resources/fabric.mod.json

      - name: Port build configuration to 26.2
        shell: bash
        run: |
          set -euxo pipefail
          sed -i \
            -e 's/^minecraft_version=.*/minecraft_version=26.2/' \
            -e 's/^loader_version=.*/loader_version=0.19.3/' \
            -e 's/^loom_version=.*/loom_version=1.17-SNAPSHOT/' \
            -e 's/^fabric_kotlin_version=.*/fabric_kotlin_version=1.13.13+kotlin.2.4.10/' \
            -e 's/^fabric_api_version=.*/fabric_api_version=0.159.0+26.2/' \
            gradle.properties

          sed -i \
            -e 's/version "2\.3\.21"/version "2.4.10"/' \
            -e 's/options\.release = 21/options.release = 25/' \
            -e 's/JvmTarget\.JVM_21/JvmTarget.JVM_25/' \
            -e 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_25/g' \
            build.gradle.kts

          sed -i 's/minecraft": "~26\.1"/minecraft": "~26.2"/' src/main/resources/fabric.mod.json
          sed -i 's/"java": ">=21"/"java": ">=25"/' src/main/resources/fabric.mod.json

      - name: Prepare final tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/migrate-nopo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --stat

      - name: Commit replacement
        shell: bash
        run: git commit -m "Replace project with NopoMod port for Minecraft 26.2"

      - name: Push replacement
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:nopomod-26.2-replace
